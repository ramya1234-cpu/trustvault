
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault_app
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - trustvault_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault_app -d trustvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trustvault_data:
